[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tampy"
version = "2.0.0"
description = "Agentic security assessment tool for e-commerce purchase-flow / business-logic testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "1ukz" }]
keywords = [
    "security",
    "pentesting",
    "e-commerce",
    "business-logic",
    "llm",
    "playwright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "openai>=1.87.0",
    "python-dotenv>=1.1.0",
    "wappalyzer==1.0.14",
    "halo>=0.0.31",
    "playwright>=1.52.0",
    "tabulate>=0.9.0",
    "requests>=2.32.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/1ukz/tampy"
Repository = "https://github.com/1ukz/tampy"

[project.scripts]
tampy = "tampy:main"

[tool.setuptools]
py-modules = ["tampy"]
packages = ["core", "phases", "resources"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E402: phase imports intentionally follow a warnings filter in tampy.py.
# E501: line length handled by the formatter, not enforced hard.
# UP006/UP007/UP035/UP045: keep typing.{Dict,Optional,...} — these annotations
#   are evaluated at runtime by Pydantic, and the builtin-generic / PEP 604
#   forms are not safe on the Python 3.9 floor this project still supports.
ignore = ["E402", "E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
# mypy analyses against >=3.10 semantics; the runtime floor stays 3.9.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
exclude = ["build/", "tests/"]

# core is the typed surface; the interactive phases/resources are not annotated.
[[tool.mypy.overrides]]
module = ["phases.*", "resources.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
